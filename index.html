<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureSpace - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="welcome">
            <h1>Welcome to SecureSpace</h1>
            <p>One account. Endless possibilities.</p>
            <p>A simple, responsive login and registration experience.</p>
        </section>

        <section class="auth-card">
            <div class="tabs">
                <button type="button" id="loginTab" class="active">Login</button>
                <button type="button" id="registerTab">Register</button>
            </div>

            <p id="message" role="status" aria-live="polite"></p>

            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="email" required>
                <label for="loginPassword">Password</label>
                <div class="password-field">
                    <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" data-target="loginPassword">Show</button>
                </div>

                <button type="submit" class="primary-btn">Login</button>
            </form>

            <form id="registerForm" hidden>
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your name" required>

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="Enter your email" required>

                <label for="registerPassword">Password</label>
                <div class="password-field">
                    <input type="password" id="registerPassword" placeholder="Create a password" minlength="6" required>
                    <button type="button" class="toggle-password" data-target="registerPassword">Show</button>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

                <button type="submit" class="primary-btn">Create Account</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
